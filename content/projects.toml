[[items]]
title = "Internship Autopilot"
subtitle = "Open-Source Project"
date = "Sept 2026"
content = "Searching for internships as an international student means checking every posting for citizenship, clearance, CPT/OPT and PhD-only restrictions, then rewriting a resume for each role. This open-source pipeline automates both: it collects new internship postings twice a day, screens them with rule-based eligibility checks, and generates a keyword-tailored one-page resume for each remaining role using greedy page packing verified by LaTeX compilation. It integrates the Greenhouse, Lever and Ashby posting APIs, tracks applications in a static HTML/JavaScript dashboard, runs on launchd or cron, and is covered by unit tests in GitHub Actions. [GitHub](https://github.com/Effervescebt/internship-autopilot)"
tags = ["Python", "Automation", "LaTeX", "Open Source"]

[[items]]
title = "Camera Color Calibration"
subtitle = "UIUC Diao Group"
date = "Sept 2024 - Dec 2025"
content = "Built a colorimetric calibration pipeline in Python (OpenCV, NumPy, colormath) that maps camera RGB to a standard color space, so printed samples can be inspected for color consistently across captures. Linearized raw images by undoing sRGB gamma, gain and white balance, extracted the mean RGB of each ColorChecker patch, and fit an RGB-to-CIE XYZ transform by least squares. Evaluated accuracy with per-patch CIEDE2000 color differences in CIELAB (D65) and applied the calibration to produce color-corrected images."
tags = ["Computer Vision", "Color Science", "Python"]

[[items]]
title = "Cyberbullying Detection with LLMs"
subtitle = "Collaborative Research Project"
date = "Aug 2025 - Present"
content = "Research on detecting implicit, context-dependent cyberbullying beyond surface-level lexical cues, using retrieval-augmented LLMs. Explored parameter-efficient fine-tuning (LoRA/QLoRA) and evaluated open models across multilingual benchmarks with systematic ablations."
tags = ["LLM", "Retrieval-Augmented", "LoRA"]

[[items]]
title = "Ant-Weight Battlebot"
subtitle = "ECE 445 Senior Design — 3rd Place"
date = "Jan 2026 - May 2026"
content = "Designed and built a two-wheel differential drive combat robot (under 2 lbs) with a horizontal drum spinner weapon and dual front wedges. Built around an ESP32-S3 microcontroller for Bluetooth control, with an MPU-6050 IMU for gyroscopic stabilization. Features a symmetric chassis for inverted operation, decoupled power rails (14.8V motor / 5V logic), and a communication watchdog for safety. Placed **3rd** in the class-wide battlebot competition. [GitHub](https://github.com/Ziheng-Qi/ECE-445-Labnote)\n\n![Final battlebot build](/battlebot-final.jpg)"
tags = ["Embedded", "Robotics", "Hardware"]

[[items]]
title = "Distributed File System"
subtitle = "Course Project"
date = "Oct 2025 - Dec 2025"
content = "Built fault-tolerant distributed file system in Python implementing MapReduce framework across multiple Linux VMs with coordinator-worker architecture for parallel data processing. Engineered SDFS operations with integrated failure detector enabling automatic fault recovery, task re-assignment, and parallel SQL query processing supporting SELECT with regex and JOIN operations on large datasets."
tags = ["Distributed Systems", "Python"]

[[items]]
title = "Unix-like Operating System Kernel"
subtitle = "Course Project"
date = "Oct 2024 - Dec 2024"
content = "Designed and implemented Unix-like kernel from scratch in C for RISC-V architecture using QEMU emulator, featuring virtual memory management with paging, address translation, and complete file system with inode structures. Built system call interface, device drivers for keyboard and display, and preemptive process scheduler supporting concurrent execution and inter-process communication. [GitHub](https://github.com/Effervescebt/Computer-System-Design)"
tags = ["Systems", "C", "OS Kernel"]

[[items]]
title = "FPGA-Based Game System Design"
subtitle = "ECE 385 Final Project"
date = "Sept 2025 - Dec 2025"
content = "Designed and implemented a hardware-accelerated treasure hunt game on FPGA using Verilog/VHDL, featuring real-time graphics rendering and HDMI video output. Built complete digital system integrating game logic, graphics controller, memory management, and USB keyboard interface on Xilinx FPGA. Achieved 60 FPS performance. [GitHub](https://github.com/Ziheng-Qi/FPGA_Game_ECE385)"
tags = ["Hardware", "FPGA", "Verilog"]
