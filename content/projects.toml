[[items]]
title = "LLM Agent Harness and Serving Optimization"
subtitle = "Personal Project"
date = "Oct 2026 - Present"
content = "A runtime for tool-using LLM agents that measures how harness design changes cost and latency. It validates every tool call against a JSON schema, sends bad calls back to the model to repair, runs independent tools in parallel, routes between cheap and strong models, and prices cache reads and writes from the provider's reported usage. On a long-horizon agentic-RAG benchmark built from HotpotQA, rolling context truncation made Claude Sonnet 5.5 4.5x more expensive than keeping the full history, because it broke the prompt-cache prefix 10.4 times per session and cut cache hits from 80% to 16%. The checkpoint compaction strategy I designed keeps the history append-only between batched compactions: 86% fewer prefix breaks, 74% cache hits and 62% lower cost at the same accuracy. Serving Qwen3-8B with vLLM on one GPU, prefix caching reached 92% KV-cache hits and raised throughput 2.6x, and 16-way continuous batching cut cost per session 87%. [GitHub](https://github.com/Effervescebt/agent-harness)"
tags = ["LLM Agents", "Prompt Caching", "vLLM", "Python"]

[[items]]
title = "Internship Autopilot"
subtitle = "Open-Source Project"
date = "Sept 2026"
content = "Searching for internships as an international student means checking every posting for citizenship, clearance, CPT/OPT and PhD-only restrictions, then rewriting a resume for each role. This open-source pipeline automates both. Twice a day it collects new postings, screens them with rule-based eligibility checks and tags each one's sponsorship terms, then builds a one-page resume for every remaining role from the user's own bullets, compiling the LaTeX after each addition to keep it to one page. It reads job descriptions through the Greenhouse, Lever and Ashby APIs, recognises the same role listed under different titles, sends an alert within the hour when a priority company posts, and tracks applications in a static dashboard. In my own use it screens about 1,600 postings per run and has generated 555 tailored resumes; 30 unit tests run in GitHub Actions. [GitHub](https://github.com/Effervescebt/internship-autopilot)"
tags = ["Python", "Automation", "LaTeX", "Open Source"]

[[items]]
title = "Camera Color Calibration"
subtitle = "UIUC Diao Group"
date = "Sept 2024 - Dec 2025"
content = "Built a colorimetric calibration pipeline in Python (OpenCV, NumPy, colormath) that maps camera RGB to a standard color space, so printed samples can be inspected for color consistently across captures. Linearized raw images by undoing sRGB gamma, gain and white balance, extracted the mean RGB of each ColorChecker patch, and fit an RGB-to-CIE XYZ transform by least squares. Evaluated accuracy with per-patch CIEDE2000 color differences in CIELAB (D65) and applied the calibration to produce color-corrected images."
tags = ["Computer Vision", "Color Science", "Python"]

